name: Snapshot My Repo

on:
  workflow_dispatch:   

jobs:
  call-snapshot:
    uses: Big-jpg/minima/.github/workflows/external-llm-snapshot.yml@main
    with:
      target_repo: Big-jpg/swaptube       # <-- set to owner/repo of THIS repo
      ref: main                              # or ${{ github.ref_name }}
      redact: true
      maxFileMB: 5
      include: ""                            # optional: "^src/,^CMakeLists\.txt$"
      exclude: ""                            # optional: "^docs/,^media/"
    # For private repos: define a repo/org secret SNAPSHOT_TOKEN (fine-grained PAT: Contents Read)
    # and pass it through. For public repos, you can remove the entire 'secrets' block.
    # secrets:
    #   SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
